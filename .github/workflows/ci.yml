name: CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - src/data/external/novels.json
      - src/data/external/youtube-videos.json
      - src/data/external/booth-products.json
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Validate CMS content
        run: npm run validate:content

      - name: Test UI foundation
        run: npm run test:ui-foundation

      - name: Test CMS proxy
        run: npm run test:cms

      - name: Test sitemap modification dates
        run: npm run test:sitemap

      - name: Test external feed snapshots
        run: npm run test:external-feed

      - name: Check Pages Function bindings
        run: npm run types:functions:check

      - name: Type-check Pages Functions
        run: npm run typecheck:functions

      - name: Check Course email Worker bindings
        run: npm run types:course-email:check

      - name: Type-check Course email Worker
        run: npm run typecheck:course-email

      - name: Test Course email Worker
        run: npm run test:course-email

      - name: Build site
        run: npm run build
