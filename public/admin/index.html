<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="msvalidate.01" content="B670753BF4A50FA5437E5694CB04BAFD" />
    <title>Hatt Sveltia CMS</title>
    <link
      rel="cms-config-url"
      href="/admin/config.yml"
      type="application/yaml"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
    <link rel="stylesheet" href="/admin/shell.css" />
    <script src="/admin/manual-init.js" defer></script>
    <script
      src="https://unpkg.com/@sveltia/cms@0.191.1/dist/sveltia-cms.js"
      integrity="sha384-1e+sEYxphmj/Z7BnuanO53c4BveZJ5fdJIkHSuHRO2T7jmC7Ih0BeJPK6x5XHxx6"
      crossorigin="anonymous"
      defer
    ></script>
    <script src="/admin/init.js" defer></script>
    <script type="module" src="/admin/product-files.js"></script>
  </head>
  <body>
    <button
      class="cms-product-files-open"
      type="button"
      data-cms-product-files-open
      aria-haspopup="dialog"
    >
      <span class="material-symbols-outlined" aria-hidden="true"
        >folder_zip</span
      >
      商品ZIP
    </button>
    <dialog
      class="cms-product-files-dialog"
      data-cms-product-files-dialog
      aria-labelledby="cms-product-files-title"
    >
      <section class="cms-product-files-panel">
        <header class="cms-product-files-header">
          <h2 id="cms-product-files-title">商品ZIP</h2>
          <button
            class="cms-icon-button"
            type="button"
            data-cms-product-files-close
            aria-label="商品ZIP管理を閉じる"
            title="閉じる"
          >
            <span class="material-symbols-outlined" aria-hidden="true"
              >close</span
            >
          </button>
        </header>

        <form class="cms-product-files-form" data-cms-product-file-upload>
          <label>
            商品
            <select name="productSlug" data-cms-product-file-product required>
              <option value="">商品を選択</option>
            </select>
          </label>
          <label>
            ZIPファイル
            <input
              type="file"
              name="file"
              accept=".zip,application/zip,application/x-zip-compressed"
              data-cms-product-file-input
              required
            />
          </label>
          <button class="cms-primary-button" type="submit">
            <span class="material-symbols-outlined" aria-hidden="true"
              >upload</span
            >
            アップロード
          </button>
        </form>

        <div
          class="cms-product-files-progress"
          data-cms-product-file-progress
          hidden
        >
          <progress max="100" value="0"></progress>
          <span>0%</span>
        </div>

        <p
          class="cms-product-files-status"
          data-cms-product-files-status
          aria-live="polite"
        ></p>

        <div class="cms-product-files-list-heading">
          <h3>登録済みZIP</h3>
          <button
            class="cms-icon-button"
            type="button"
            data-cms-product-files-refresh
            aria-label="登録済みZIPを再読み込み"
            title="再読み込み"
          >
            <span class="material-symbols-outlined" aria-hidden="true"
              >refresh</span
            >
          </button>
        </div>
        <div class="cms-product-files-list" data-cms-product-files-list>
          <p>商品を選択してください。</p>
        </div>
      </section>
    </dialog>
    <main id="nc-root"></main>
  </body>
</html>
